module:
  id: "03.short_read_qc"
  title: "原始短读长质控(FastQC + MultiQC,conda 环境)"
  snakefile: "rules/03.short_read_qc.smk"
  stage: "01.qc"
  summary: >
    对原始 R1/R2 reads 分别运行 FastQC,并用 MultiQC 分方向聚合全部样本报告,
    为下游去接头/质控决策提供依据。
  requires_helpers: []

rules:
  - name: short_read_qc_r1
    summary: "对单个样本的 R1 reads 运行 FastQC"
    wildcards: ["sample"]
    dynamic: false
    per_sample: true
    inputs:
      - name: link_r1_dir
        port: "reads.r1.fastq"
        pattern: "00.raw_data/link_dir/{sample}/{sample}_R1.fq.gz"
        config_keys: ["convert_md5"]
      - name: md5_check
        port: "qc.md5_check.tsv"
        pattern: "01.qc/md5_check.tsv"
        role: gate
    outputs:
      - name: r1_html
        port: "qc.fastqc.html"
        pattern: "01.qc/short_read_qc_r1/{sample}_R1_fastqc.html"
        kind: report
      - name: r1_zip
        port: "qc.fastqc.zip"
        pattern: "01.qc/short_read_qc_r1/{sample}_R1_fastqc.zip"
        kind: intermediate
    config_requires:
      - "convert_md5"
      - key: "parameter.threads.fastqc"
        type: "integer"
        minimum: 1
        maximum: 64
        default: 2
        description: "FastQC 线程数"
    conda: "envs/fastqc.yaml"
    resources_tier: "low_resource"

  - name: short_read_qc_r2
    summary: "对单个样本的 R2 reads 运行 FastQC"
    wildcards: ["sample"]
    dynamic: false
    per_sample: true
    inputs:
      - name: link_r2_dir
        port: "reads.r2.fastq"
        pattern: "00.raw_data/link_dir/{sample}/{sample}_R2.fq.gz"
        config_keys: ["convert_md5"]
      - name: md5_check
        port: "qc.md5_check.tsv"
        pattern: "01.qc/md5_check.tsv"
        role: gate
    outputs:
      - name: r2_html
        port: "qc.fastqc.html"
        pattern: "01.qc/short_read_qc_r2/{sample}_R2_fastqc.html"
        kind: report
      - name: r2_zip
        port: "qc.fastqc.zip"
        pattern: "01.qc/short_read_qc_r2/{sample}_R2_fastqc.zip"
        kind: intermediate
    config_requires:
      - "convert_md5"
      - key: "parameter.threads.fastqc"
        type: "integer"
        minimum: 1
        maximum: 64
        default: 2
        description: "FastQC 线程数"
    conda: "envs/fastqc.yaml"
    resources_tier: "low_resource"

  - name: short_read_multiqc_r1
    summary: "聚合全部样本 R1 FastQC 结果为一份 MultiQC 报告"
    wildcards: []
    dynamic: false
    per_sample: false
    inputs:
      - name: fastqc_files_r1
        port: "qc.fastqc.zip"
        pattern: "01.qc/short_read_qc_r1/{sample}_R1_fastqc.zip"
        expand_over: samples
    outputs:
      - name: report
        port: "qc.multiqc.report"
        pattern: "01.qc/short_read_r1_multiqc/multiqc_r1_raw-data_report.html"
        kind: report
    config_requires:
      - key: "parameter.threads.multiqc"
        type: "integer"
        minimum: 1
        maximum: 32
        default: 2
        description: "MultiQC 线程数"
    conda: "envs/multiqc.yaml"
    resources_tier: "low_resource"

  - name: short_read_multiqc_r2
    summary: "聚合全部样本 R2 FastQC 结果为一份 MultiQC 报告"
    wildcards: []
    dynamic: false
    per_sample: false
    inputs:
      - name: fastqc_files_r2
        port: "qc.fastqc.zip"
        pattern: "01.qc/short_read_qc_r2/{sample}_R2_fastqc.zip"
        expand_over: samples
    outputs:
      - name: report
        port: "qc.multiqc.report"
        pattern: "01.qc/short_read_r2_multiqc/multiqc_r2_raw-data_report.html"
        kind: report
    config_requires:
      - key: "parameter.threads.multiqc"
        type: "integer"
        minimum: 1
        maximum: 32
        default: 2
        description: "MultiQC 线程数"
    conda: "envs/multiqc.yaml"
    resources_tier: "low_resource"
